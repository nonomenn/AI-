# ============================================================
#  スタイル設定(テロップ・トランジション・尺)
#  座標はすべて 1080x1920(縦型 9:16)基準のピクセル値
#  現状のTikTok動画(TOALU)の画面録画から採寸した値を初期値にしている
# ============================================================

canvas:
  width: 1080
  height: 1920
  fps: 30

duration:
  min: 30.0          # 目標尺(秒)
  max: 40.0

# ---------- 素材の自動カット(安定区間の抽出) ----------
analyze:
  sample_hz: 10            # 解析のサンプリング頻度
  min_segment: 1.8         # 使える区間の最短(秒)
  max_speed: 0.70          # これより速いカメラ移動は「移動中」「振り回し」とみなして捨てる(画面幅/秒)
  ideal_speed: 0.25        # 理想の速さ(ジンバルでゆっくり歩く程度)。これに近いほど高評価
  ideal_speed_width: 0.20
  max_shake: 0.035         # 手ブレ量の上限
  min_sharpness_ratio: 0.30  # クリップ内中央値に対するシャープネス比の下限(ブレ・ピンボケ除外)
  trim_edges: 0.2          # 区間の両端を少し削って、動き出し/止まりを避ける
  split_max: 6.5           # これより長い安定区間は分割する(長回しを部屋ごとに判定するため)
  split_target: 5.0        # 分割するときの1区間の長さ

# ---------- 見せ方(ゆっくり・上品) ----------
motion:
  slow_speed: 0.8          # 60fps素材の再生速度(0.8 = 少しスロー)
  slow_min_fps: 50
  low_fps_speed: 0.8       # 60fps未満(30fps)の素材の再生速度。中間コマを作ってなめらかにスローにする
  low_fps_interp: blend    # 中間コマの作り方: blend(前後のコマを混ぜる・速い) / flow(動きを推定・高画質だが約30倍遅い) / none(スローにしない)
  push_in: [1.00, 1.04]    # 各カットでゆっくり寄る(Ken Burns)。開始倍率→終了倍率

transitions:
  same_room:   {type: dissolve,      duration: 0.8}    # 同じ部屋の中のカット間
  room_change: {type: blur_dissolve, duration: 1.1}    # 部屋が変わるとき(一番上品に見せる所)
  to_ad:       {type: fade_white,    duration: 0.50}
  from_ad:     {type: fade_white,    duration: 0.50}
  default:     {type: dissolve,      duration: 0.50}
  ending_fade: 0.0          # 最後に黒へフェード(秒)。TikTokのループ再生を考えて初期値は0

# ---------- フォント ----------
# 候補を順に探す(ファイル名だけでよい)。探す場所: 物件動画/共通/フォント/ → assets/fonts/ → OSの書体フォルダ
# 実際に使っている書体を 物件動画/共通/フォント/ に置き、その名前を各リストの先頭に書けば差し替わる
# 確認: python -m autoedit.fonts 物件動画/共通/フォント
fonts:
  heavy_serif:   # 見所・キャッチ(極太明朝)
    [NotoSerifCJK-Black.ttc, NotoSerifJP-Black.otf, NotoSerifCJKjp-Black.otf, NotoSerifJP-Black.ttf, "ヒラギノ明朝 ProN.ttc", yumindb.ttf]
  serif_bold:    # 部屋紹介のサブコピー
    [ZenAntique-Regular.ttf, NotoSerifCJK-Bold.ttc, NotoSerifJP-Bold.otf, NotoSerifCJKjp-Bold.otf, NotoSerifJP-Bold.ttf, "ヒラギノ明朝 ProN.ttc", yumindb.ttf]
  latin_serif:   # 部屋名(英字セリフ)。今の動画の Premiere テキストスタイルは Zen Antique
    [ZenAntique-Regular.ttf, NotoSerifCJK-Regular.ttc, NotoSerifJP-Regular.otf, NotoSerifCJKjp-Regular.otf, NotoSerifJP-Regular.ttf, "ヒラギノ明朝 ProN.ttc", yumin.ttf]
  heavy_serif_thumb:   # サムネのタイトル(極太明朝)
    [NotoSerifCJK-Black.ttc, NotoSerifJP-Black.otf, NotoSerifCJKjp-Black.otf, NotoSerifJP-Black.ttf, "ヒラギノ明朝 ProN.ttc", yumindb.ttf]
  serif_bold_thumb:    # サムネのサブ・情報バー・物件番号
    [NotoSerifCJK-Bold.ttc, NotoSerifJP-Bold.otf, NotoSerifCJKjp-Bold.otf, NotoSerifJP-Bold.ttf, "ヒラギノ明朝 ProN.ttc", yumindb.ttf]
  sans_bold:     # CTA・ルームツアーSTART
    [NotoSansCJK-Bold.ttc, NotoSansJP-Bold.otf, NotoSansCJKjp-Bold.otf, NotoSansJP-Bold.ttf, "ヒラギノ角ゴシック W6.ttc", YuGothB.ttc]

# ---------- テロップ ----------
# 影は「くっきりしたドロップシャドウ + 広くやわらかい影」の重ねがけ。明るい白壁の上でも読めるようにする
telops:
  hook:            # 冒頭の見所(動画冒頭テロップ)
    font: heavy_serif
    size: 84
    center_y: 450
    max_width: 960
    color: [255, 255, 255]
    italic_skew: 0.12            # 斜体の傾き
    shadow:
      - {offset: [0, 0], blur: 22, spread: 6, color: [0, 0, 0], opacity: 0.55}   # 文字の周りを暗くする広い影
      - {offset: [7, 7], blur: 2, color: [0, 0, 0], opacity: 0.95}              # くっきりした黒のドロップシャドウ
    fade_in: 0.35
    fade_out: 0.3

  catch:           # キャッチ + 傍点
    font: heavy_serif
    size: 78
    center_y: 470
    line_spacing: 1.28
    max_width: 1000
    color: [255, 255, 255]
    italic_skew: 0.12
    shadow:
      - {offset: [0, 0], blur: 22, spread: 6, color: [0, 0, 0], opacity: 0.55}
      - {offset: [7, 7], blur: 2, color: [0, 0, 0], opacity: 0.95}
    emphasis_dot:
      radius: 12
      gap_above: 14
      blink: {period: 0.9, min_alpha: 0.12}    # 傍点だけ点滅(周期・いちばん暗いときの濃さ)
    fade_in: 0.35
    fade_out: 0.3

  start:           # 「ルームツアー START」両側から集まって現れ、最後は左右に分かれて消える
    font: sans_bold
    size: 50
    center_y: 960
    letter_spacing: 34
    color: [255, 255, 255]
    italic_skew: 0.18
    shadow:
      - {offset: [0, 0], blur: 14, spread: 3, color: [0, 0, 0], opacity: 0.5}
      - {offset: [3, 3], blur: 2, color: [0, 0, 0], opacity: 0.8}
    enter_spread: 60             # 現れるとき、左右この距離(px × 端からの位置)から中央へ
    exit_spread: 320             # 消えるとき、左右へ分かれる距離(px)
    fade_in: 0.5
    fade_out: 0.7

  room:            # 部屋紹介「Living / 暮らしの中心になる心地よい空間」
    # 書体とサイズは現状の Premiere テキストスタイル(Zen Antique 90px / 45px)
    title_font: latin_serif
    title_size: 90
    sub_font: serif_bold
    sub_size: 45
    center_y: 330                # 英字タイトルの中心
    sub_gap: 18
    color: [255, 255, 255]
    shadow:
      - {offset: [0, 0], blur: 20, spread: 5, color: [0, 0, 0], opacity: 0.6}
      - {offset: [4, 5], blur: 3, color: [0, 0, 0], opacity: 0.85}
    fade_in: 0.8                 # ふわっと出す
    rise: 14                     # 出るときに少し浮き上がる(px)
    fade_out: 0.5
    delay: 0.4                   # カット頭から少し遅らせて出す

  cta:             # 「気になった方は詳細とコメント✓」+ 矢印
    font: sans_bold
    size: 50
    center_y: 460
    center_x: 540
    italic_skew: 0.14
    color: [255, 255, 255]
    box: {pad_x: 28, pad_y: 14, border: 4, border_color: [255, 255, 255], fill: [0, 0, 0], fill_opacity: 0.35}
    check_icon: true
    fade_in: 0.4
    # ---- 矢印:TikTokのアカウントアイコンを真横から指す ----
    # target = アイコン中心の推定位置(1080x1920 動画座標)。画面録画から採寸: 中心 ≒ (953, 960)、半径 ≒ 54px
    arrow:
      target: [953, 960]
      target_radius: 54
      gap: 16                    # アイコンの縁から矢印の先端までの隙間
      angle_deg: 0               # 0 = 真横(左から右へ)
      length: 250
      thickness: 15              # 付け根の太さ
      tail_width: 5              # 尾の太さ(尾に向かって細く・透明になる)
      head: 54                   # 矢じりの長さ
      head_width: 64
      notch: 0.62                # 矢じり後ろの切れ込み(0〜1)
      color: [255, 255, 255]
      shadow:
        - {offset: [0, 0], blur: 12, spread: 7, color: [0, 0, 0], opacity: 0.7}
        - {offset: [3, 4], blur: 2, spread: 1, color: [0, 0, 0], opacity: 0.8}
      nudge: {amplitude: 14, period: 1.1}   # 先端方向にツンと動かして目線を誘導

# ---------- サムネイル(黒×ゴールドのテンプレート。完成見本 No.L030〜L032 から採寸) ----------
# 比率 1149×1369 は固定(変えない)。変えてよいのは文言・写真・物件番号だけ
thumbnail:
  width: 1149
  height: 1369
  fonts: {title: heavy_serif_thumb, text: serif_bold_thumb}
  gold: [[255, 238, 178], [236, 196, 112], [196, 142, 58], [150, 100, 36]]   # 上→下のグラデーション
  line_gold: [201, 160, 84]
  white: [250, 248, 242]
  frame: {inset: 9, width: 2}                    # 外枠のゴールド線
  glow: {y: 42, width: 440, height: 3}          # 最上部の光るライン
  title: {center_y: 128, size: 82, max_width: 1080, digit_scale: 1.22, kana_scale: 0.84}
  sub: {center_y: 214, size: 44, max_width: 1040}
  bar: {x0: 40, x1: 1108, y0: 276, y1: 362, border: 2, size: 36, color: [240, 222, 172]}
  photo: {x0: 33, y0: 384, x1: 1116, y1: 1258, radius: 26, border: 3}
  play: {center: [574, 790], radius: 112, stroke: 11}
  number: {center_y: 1308, size: 50, line_len: 125, line_gap: 38, line_width: 2}
