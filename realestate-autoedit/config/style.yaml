# ============================================================
#  スタイル設定(テロップ・トランジション・尺)
#  座標はすべて 1080x1920(縦型 9:16)基準のピクセル値
#  現状のTikTok動画(TOALU)の画面録画から採寸した値を初期値にしている
# ============================================================

canvas:
  width: 1080
  height: 1920
  fps: 30
  crf: 20            # 画質(小さいほど高画質・大きいファイル)。20で45秒 約30MB(ドライブ保存の上限35MB以内)
  preset: slow

duration:
  min: 30.0          # 目標尺(秒)
  max: 45.0          # 見どころをしっかり見せるため45秒まで(当初は40秒)

# ---------- 素材の自動カット(安定区間の抽出) ----------
analyze:
  sample_hz: 10            # 解析のサンプリング頻度
  min_segment: 1.8         # 使える区間の最短(秒)
  max_speed: 0.70          # これより速いカメラ移動は「移動中」「振り回し」とみなして捨てる(画面幅/秒)
  ideal_speed: 0.25        # 理想の速さ(ジンバルでゆっくり歩く程度)。これに近いほど高評価
  ideal_speed_width: 0.20
  max_shake: 0.035         # 手ブレ量の上限
  min_sharpness_ratio: 0.30  # クリップ内中央値に対するシャープネス比の下限(ブレ・ピンボケ除外)
  trim_edges: 0.2          # 区間の両端を少し削って、動き出し/止まりを避ける
  split_max: 6.5           # これより長い安定区間は分割する(長回しを部屋ごとに判定するため)
  split_target: 5.0        # 分割するときの1区間の長さ
  duplicate_inliers: 25    # 中央のコマで対応の取れる特徴点がこれ以上あるカット同士は「同じ映像」とみなし、2回使わない
                           # (実測: 同じ映像 48〜119、別の映像 0〜16)

# ---------- 見せ方(ゆっくり・上品) ----------
motion:
  slow_speed: 0.8          # 60fps素材の再生速度(0.8 = 少しスロー)
  slow_min_fps: 50
  low_fps_speed: 0.8       # 60fps未満(30fps)の素材の再生速度。中間コマを作ってなめらかにスローにする
  low_fps_interp: blend    # 中間コマの作り方: blend(前後のコマを混ぜる・速い) / flow(動きを推定・高画質だが約30倍遅い) / none(スローにしない)
  # カメラが速く動いているカットほど、さらにスローにする(目標の見かけの速さに近づける)
  adaptive_slow: {target_speed: 0.12, min_speed_60fps: 0.5, min_speed_30fps: 0.7}
  ad_zoom: 0.0             # 広告画像は動かさない(寄ると文字が読みにくい)
  push_in: [1.00, 1.04]    # 各カットでゆっくり寄る(Ken Burns)。開始倍率→終了倍率

# ---------- トランジション(基本はカット。意味のある切れ目だけ、やわらかく切り替える) ----------
# 毎回トランジションを入れると映像がうるさくなるので、基本はカット(動きつなぎ)。
# 1本の動画でやわらかい切り替えは4〜5回まで。どこで使うかで「章が変わった」と伝わるようにする
transitions:
  base:            {type: cut,           duration: 0.0}   # (7) 基本。前後で動きの向きがそろっていればカットでつなぐ
  motion_mismatch: {type: dissolve,      duration: 0.6}   # (2) 前後で動きの向きが逆(左パン→右パン等)で、カットだとガクッとするとき
  zone_change:     {type: blur_dissolve, duration: 1.0}   # (1) 区画が変わるとき(LDK→水回り、水回り→個室 など。template.yaml の zones)
  tour_start:      {type: blur_dissolve, duration: 1.0}   # (1) START → 最初の部屋(ルームツアーの始まり)
  to_cta:          {type: light_leak,    duration: 1.2}   # (3) 最後の見せ場(眺望・バルコニー)へ。1本に1回だけ
  to_bridge:       {type: dissolve,      duration: 0.7}   # (2) 部屋 → 廊下・階段のつなぎ。つなぎから次の部屋へは歩きの流れのままカット
  to_ad:           {type: dissolve,      duration: 0.5}   # (2) 広告の前後
  from_ad:         {type: dissolve,      duration: 0.5}
  motion_tolerance: 0.06    # 横の動きがこれより小さいカットは「ほぼ止まっている」とみなし、どの向きともカットでつなげる
  ending_fade: 0.0          # 最後に黒へフェード(秒)。TikTokのループ再生を考えて初期値は0

# ---------- フォント ----------
# 候補を順に探す(ファイル名だけでよい)。探す場所: 物件動画/共通/フォント/ → assets/fonts/ → OSの書体フォルダ
# 実際に使っている書体を 物件動画/共通/フォント/ に置き、その名前を各リストの先頭に書けば差し替わる
# 確認: python -m autoedit.fonts 物件動画/共通/フォント
fonts:
  heavy_serif:   # 見所・キャッチ(極太明朝)
    [NotoSerifCJK-Black.ttc, NotoSerifJP-Black.otf, NotoSerifCJKjp-Black.otf, NotoSerifJP-Black.ttf, "ヒラギノ明朝 ProN.ttc", yumindb.ttf]
  serif_bold:    # 部屋紹介のサブコピー
    [ZenAntique-Regular.ttf, NotoSerifCJK-Bold.ttc, NotoSerifJP-Bold.otf, NotoSerifCJKjp-Bold.otf, NotoSerifJP-Bold.ttf, "ヒラギノ明朝 ProN.ttc", yumindb.ttf]
  latin_serif:   # 部屋名(英字セリフ)。今の動画の Premiere テキストスタイルは Zen Antique
    [ZenAntique-Regular.ttf, NotoSerifCJK-Regular.ttc, NotoSerifJP-Regular.otf, NotoSerifCJKjp-Regular.otf, NotoSerifJP-Regular.ttf, "ヒラギノ明朝 ProN.ttc", yumin.ttf]
  heavy_serif_thumb:   # サムネのタイトル(太明朝。完成見本は Black より細い)
    [NotoSerifCJK-Bold.ttc, NotoSerifCJK-Black.ttc, NotoSerifJP-Black.otf, NotoSerifCJKjp-Black.otf, NotoSerifJP-Black.ttf, "ヒラギノ明朝 ProN.ttc", yumindb.ttf]
  serif_bold_thumb:    # サムネのサブ・情報バー・物件番号
    [NotoSerifCJK-Bold.ttc, NotoSerifJP-Bold.otf, NotoSerifCJKjp-Bold.otf, NotoSerifJP-Bold.ttf, "ヒラギノ明朝 ProN.ttc", yumindb.ttf]
  sans_medium:   # CTA(今の動画は中くらいの太さのゴシック)
    [NotoSansCJK-Medium.ttc, NotoSansJP-Medium.otf, NotoSansCJKjp-Medium.otf, NotoSansJP-Medium.ttf, "ヒラギノ角ゴシック W5.ttc", YuGothM.ttc]
  sans_bold:     # ルームツアーSTART
    [NotoSansCJK-Bold.ttc, NotoSansJP-Bold.otf, NotoSansCJKjp-Bold.otf, NotoSansJP-Bold.ttf, "ヒラギノ角ゴシック W6.ttc", YuGothB.ttc]

# ---------- テロップ ----------
# 影は「くっきりしたドロップシャドウ + 広くやわらかい影」の重ねがけ。明るい白壁の上でも読めるようにする
telops:
  # 寸法・影は今のTOALU動画(No.L035)の画面から採寸(画面→動画座標に換算)
  hook:            # 冒頭の見所(動画冒頭テロップ)。今の動画: 幅954px・中心y462
    font: heavy_serif
    size: 104
    palt: true                   # かな・句読点を詰める(今の動画と同じ詰め方)
    x_scale: 0.85                # 横方向に少し縮めて、背の高い文字にする
    center_y: 462
    max_width: 954
    color: [255, 255, 255]
    italic_skew: 0.12            # 斜体の傾き
    shadow:
      - {offset: [9, 10], blur: 4, color: [0, 0, 0], opacity: 0.45}             # 押し出し影の下のやわらかい影
      - {offset: [6, 6], blur: 0, extrude: true, color: [0, 0, 0], opacity: 1.0}  # くっきりした黒の押し出し影(立体的)
    fade_in: 0.35
    fade_out: 0.3

  catch:           # キャッチ + 傍点。今の動画: 傍点〜2行目で y367〜600、行の間隔100px、傍点の半径17px
    font: heavy_serif
    size: 92
    palt: true
    center_y: 483                # 傍点を含むブロック全体の中心
    line_spacing: 1.087
    max_width: 1000
    color: [255, 255, 255]
    italic_skew: 0.12
    shadow:
      - {offset: [9, 10], blur: 4, color: [0, 0, 0], opacity: 0.45}
      - {offset: [6, 6], blur: 0, extrude: true, color: [0, 0, 0], opacity: 1.0}
    emphasis_dot:
      radius: 17
      gap_above: 12
      blink: {period: 0.9, min_alpha: 0.12}    # 傍点だけ点滅(周期・いちばん暗いときの濃さ)
    fade_in: 0.35
    fade_out: 0.3

  start:           # 「ルームツアー START」両側から集まって現れ、最後は左右に分かれて消える
    font: sans_bold
    size: 50
    center_y: 960
    letter_spacing: 34
    color: [255, 255, 255]
    italic_skew: 0.18
    shadow:
      - {offset: [0, 0], blur: 14, spread: 3, color: [0, 0, 0], opacity: 0.5}
      - {offset: [3, 3], blur: 2, color: [0, 0, 0], opacity: 0.8}
    enter_spread: 60             # 現れるとき、左右この距離(px × 端からの位置)から中央へ
    exit_spread: 320             # 消えるとき、左右へ分かれる距離(px)
    fade_in: 0.5
    fade_out: 0.7

  room:            # 部屋紹介「Living / 暮らしの中心になる心地よい空間」
    # 書体とサイズは現状の Premiere テキストスタイル(Zen Antique 90px / 45px)
    # 今の動画: 「Living」幅246px・中心y330、サブ幅564px・中心y400(字間を広く)
    title_font: latin_serif
    title_size: 82
    sub_font: serif_bold
    sub_size: 38
    sub_letter_spacing: 3        # サブコピーの字間(px)
    center_y: 306                # 英字タイトル(行の高さ)の中心
    sub_gap: 14
    color: [255, 255, 255]
    shadow:
      - {offset: [4, 5], blur: 5, color: [0, 0, 0], opacity: 0.75}
    fade_in: 0.8                 # ふわっと出す
    rise: 14                     # 出るときに少し浮き上がる(px)
    fade_out: 0.5
    delay: 0.4                   # カット頭から少し遅らせて出す

  cta:             # 「気になった方は詳細とコメント✓」+ 矢印
    font: sans_medium
    size: 56
    palt: true
    letter_spacing: -3           # 字間を詰める
    x_scale: 0.86                # 今の動画の文字は縦長でつまっている
    text_shadow: [{offset: [2, 3], blur: 2, color: [0, 0, 0], opacity: 0.6}]
    center_y: 463                # 今の動画: 枠 754×95px・中心(539,463)
    center_x: 540
    italic_skew: 0.22
    color: [255, 255, 255]
    box: {pad_x: 33, pad_y: 8, border: 4, border_color: [255, 255, 255], fill: [0, 0, 0], fill_opacity: 0.35}
    check_icon: true
    check_scale: 0.95            # ✓アイコンの大きさ(文字サイズ比)
    check_gap: 0                 # 文字と✓の間
    fade_in: 0.4
    reveal: {duration: 0.33, start: 0.04}   # 横線から上下に開いて現れる(秒、最初の高さの割合)
    # ---- 矢印:TikTokのアカウントアイコンを真横から指す ----
    # target = アイコン中心の推定位置(1080x1920 動画座標)。画面録画から採寸: 中心 ≒ (953, 960)、半径 ≒ 54px
    arrow:
      target: [953, 960]
      target_radius: 54
      gap: 16                    # アイコンの縁から矢印の先端までの隙間
      angle_deg: 0               # 0 = 真横(左から右へ)
      length: 250
      thickness: 15              # 付け根の太さ
      tail_width: 5              # 尾の太さ(尾に向かって細く・透明になる)
      head: 54                   # 矢じりの長さ
      head_width: 64
      notch: 0.62                # 矢じり後ろの切れ込み(0〜1)
      color: [255, 255, 255]
      shadow:
        - {offset: [0, 0], blur: 12, spread: 7, color: [0, 0, 0], opacity: 0.7}
        - {offset: [3, 4], blur: 2, spread: 1, color: [0, 0, 0], opacity: 0.8}
      nudge: {amplitude: 14, period: 1.1}   # 先端方向にツンと動かして目線を誘導

# ---------- サムネイル(黒×ゴールドのテンプレート。完成見本 No.L030〜L032 から採寸) ----------
# 比率 1149×1369 は固定(変えない)。変えてよいのは文言・写真・物件番号だけ
thumbnail:
  width: 1149
  height: 1369
  fonts: {title: heavy_serif_thumb, text: serif_bold_thumb}
  gold:                    # 光沢のあるゴールド(完成見本から採色)
    stops:                 # [文字の高さの位置(0=上 1=下), R, G, B]
      - [0.00, 255, 214, 102]
      - [0.22, 255, 232, 140]
      - [0.40, 255, 240, 168]    # 光の帯
      - [0.55, 246, 200, 86]
      - [0.75, 212, 146, 44]
      - [0.88, 236, 184, 80]     # 下の照り返し
      - [1.00, 168, 104, 26]
    bevel: 1.6             # 面取りの幅(px)
    highlight: 0.55        # 光が当たる縁の明るさ
    shade: 0.35            # 影になる縁の暗さ
    outline: 1.0           # 焦げ茶の縁取りの太さ(px)
    outline_color: [70, 40, 8]
  line_gold: [201, 160, 84]
  white: [250, 248, 242]
  frame: {inset: 9, width: 2}                    # 外枠のゴールド線
  glow: {y: 42, width: 440, height: 3}          # 最上部の光るライン
  title: {center_y: 122, size: 82, max_width: 1010, digit_scale: 1.22, kana_scale: 0.84}
  sub: {center_y: 210, size: 42, max_width: 1000}
  bar: {x0: 40, x1: 1108, y0: 276, y1: 362, border: 2, radius: 8, size: 36, color: [246, 238, 222],
        number_color: [236, 186, 82], number_scale: 1.3}
  photo: {x0: 33, y0: 384, x1: 1116, y1: 1258, radius: 26, border: 3}
  play: {center: [574, 790], radius: 112, stroke: 11}
  number: {center_y: 1308, size: 50, line_len: 125, line_gap: 38, line_width: 2}
