# ============================================================
#  部屋紹介テロップの文言辞書
#  現状の動画で使っている表記(英字小文字混じり + 明朝のサブコピー)に合わせている
#  title: 英字の部屋名 / sub: サブコピー
# ============================================================

rooms:
  living:        {title: "Living",       sub: "暮らしの中心になる心地よい空間"}
  dining:        {title: "Dining",       sub: "会話が弾むくつろぎのひととき"}
  kitchen:       {title: "Kitchen",      sub: "料理が楽しくなる洗練された空間"}
  bedroom:       {title: "Bedroom",      sub: "一日の疲れを癒す上質な寝室"}
  western_room:  {title: "Room",         sub: "ライフスタイルに合わせて使える空間"}
  japanese_room: {title: "Japanese room", sub: "心落ち着く和の空間"}
  closet:        {title: "Closet",       sub: "たっぷり収納で片付く暮らし"}
  washroom:      {title: "Powder room",  sub: "朝の支度がはかどる洗面空間"}
  bathroom:      {title: "bath room",    sub: "心身を癒すリラックス空間"}
  toilet:        {title: "toilet",       sub: "気持ちよく使える清潔空間"}
  balcony:       {title: "Balcony",      sub: "開放感あふれる眺望"}
  exterior:      {title: "Exterior",     sub: "存在感のある外観"}
  entrance_hall: {title: "Entrance",     sub: "上質な共用エントランス"}

cta:
  text: "気になった方は詳細とコメント"

start:
  text: "ルームツアー START"

# この物件ならではの見どころ(property.yaml の highlights の key)の文言の初期値。
# near = 近くの部屋(区画の判定と、並べる順番の目安)、words = 冒頭テロップ等でこの見どころを指す言葉
# rare = 賃貸ではなかなかない特徴。尺が長くなっても落とさず、必ず見せる
features:
  garage:         {title: "Garage",          sub: "愛車を守るビルトインガレージ",       near: genkan,        words: [ガレージ], rare: true}
  shoe_closet:    {title: "Shoe closet",     sub: "玄関まわりを美しく整える収納空間",   near: genkan,        words: [土間収納, シューズ]}
  pantry:         {title: "Pantry",          sub: "キッチン横の大容量パントリー",       near: kitchen,       words: [パントリー]}
  laundry:        {title: "Laundry room",    sub: "家事がはかどるランドリールーム",     near: washroom,      words: [ランドリー]}
  walk_in_closet: {title: "Walk-in closet",  sub: "衣類をまとめて収める大容量収納",     near: bedroom,       words: [ウォークイン, WIC]}
  sauna:          {title: "Sauna",           sub: "自宅で整うプライベートサウナ",       near: bathroom,      words: [サウナ], rare: true}
  terrace:        {title: "Terrace",         sub: "空を感じる開放的な屋外テラス",       near: balcony,       words: [テラス], rare: true}
  roof_balcony:   {title: "Roof balcony",    sub: "眺望を独り占めするルーフバルコニー", near: balcony,       words: [ルーフバルコニー], rare: true}
  private_garden: {title: "Garden",          sub: "緑を楽しむ専用庭",                   near: living,        words: [専用庭, 庭], rare: true}
  marble:         {title: "Marble",          sub: "上質な大理石の天板",                 near: kitchen,       words: [大理石], rare: true}
  island_kitchen: {title: "Island kitchen",  sub: "会話が弾むアイランドキッチン",       near: kitchen,       words: [アイランド], rare: true}
  atrium:         {title: "Atrium",          sub: "光が降り注ぐ吹き抜け",               near: living,        words: [吹き抜け], rare: true}
  view:           {title: "View",            sub: "日常を彩る眺望",                     near: balcony,       words: [眺望, 一望], rare: true}
